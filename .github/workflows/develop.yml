name: Dev Build & Publish (next)

on:
  push:
    branches:
      - develop

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 1) TypeScript Build
      - name: Build TypeScript packages
        run: pnpm exec tsc -b packages/*

      # 2) Vite-Build for React & Vue
      - name: Build React package
        run: pnpm --filter webgl-chart-react build

      - name: Build Vue package
        run: pnpm --filter webgl-chart-vue build

      # 3) Documentation
      - name: Build documentation
        run: |
          cd docu
          pnpm run docs:build

      - name: Zip documentation
        run: |
          cd docu/docs/.vuepress/dist
          zip -r ../../../docs.zip .

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-next
          path: docu/docs.zip

      # 4) Publish
      - name: Publish packages (next)
        run: |
          for pkg in webgl-lib webgl-chart webgl-chart-react webgl-chart-vue; do
            cd packages/$pkg
            npm publish --tag next --access public
            cd ../..
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

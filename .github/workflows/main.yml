name: Release Build & Publish (latest)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm?"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: |
          cd docu
          pnpm run docs:build

      - name: Zip documentation
        run: |
          cd docu/.vuepress/dist
          zip -r ../../docs.zip .

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-latest
          path: docu/docs.zip

      - name: Build all packages
        run: pnpm -r build

      - name: Publish packages (latest)
        if: ${{ github.event.inputs.publish == 'yes' }}
        run: |
          for pkg in webgl-lib webgl-chart webgl-chart-react webgl-chart-vue; do
            cd packages/$pkg
            npm publish --tag latest --access public
            cd ../..
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}